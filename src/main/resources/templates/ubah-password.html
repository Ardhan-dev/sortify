<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sortify — Ubah Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f0c; --surface: #141710; --surface-raised: #1a1e16;
      --border: rgba(134, 187, 76, 0.12); --border-hover: rgba(134, 187, 76, 0.28);
      --border-focus: rgba(134, 187, 76, 0.55); --accent: #86bb4c;
      --accent-dim: rgba(134, 187, 76, 0.08);
      --text-primary: #e8ede2; --text-secondary: #8a9480; --text-muted: #4e5749;
      --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
    }
    body { background: var(--bg); color: var(--text-primary); font-family: var(--sans); font-size: 15px; min-height: 100vh; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(134,187,76,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(134,187,76,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    .wrapper { position: relative; z-index: 1; max-width: 500px; margin: 0 auto; padding: 0 2rem 4rem; }
    header { padding: 2rem 0 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .brand-icon svg { width: 20px; height: 20px; fill: var(--bg); }
    .brand-name { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--accent); }
    .brand-version { font-family: var(--mono); font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
    .page-head { padding: 3rem 0 2rem; }
    .page-label { font-family: var(--mono); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; margin-bottom: 0.6rem; }
    .page-label::before { content: ''; display: block; width: 24px; height: 1px; background: var(--accent); }
    .page-title { font-size: 2rem; font-weight: 300; letter-spacing: -1px; }
    .page-title strong { font-weight: 500; color: var(--accent); }
    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; animation: fadeUp 0.45s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .form-card-header { padding: 1.25rem 1.75rem; background: var(--surface-raised); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .form-card-header-icon { width: 28px; height: 28px; border-radius: 6px; background: var(--accent-dim); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .form-card-header-icon svg { width: 14px; height: 14px; stroke: var(--accent); fill: none; stroke-width: 2; }
    .form-card-header-title { font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
    .form-body { padding: 2rem 1.75rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; }
    .form-input { width: 100%; padding: 0.7rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-family: var(--sans); font-size: 14px; outline: none; transition: border-color 0.18s, box-shadow 0.18s; }
    .form-input:hover { border-color: var(--border-hover); }
    .form-input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(134,187,76,0.08); }
    .alert { padding: 0.85rem 1.25rem; border-radius: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.5px; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; border: 1px solid; }
    .alert-success { background: var(--accent-dim); border-color: rgba(134,187,76,0.3); color: var(--accent); }
    .alert-error { background: rgba(224,84,84,0.1); border-color: rgba(224,84,84,0.25); color: #e05454; }
    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 0.6rem 1.25rem; font-family: var(--mono); font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; text-decoration: none; border-radius: 7px; border: 1px solid; cursor: pointer; transition: all 0.18s; }
    .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    .btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .btn-primary:hover { background: #97cc5a; border-color: #97cc5a; }
    .btn-ghost { background: transparent; color: var(--text-secondary); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--border-hover); color: var(--text-primary); background: var(--accent-dim); }
    .form-divider { height: 1px; background: var(--border); margin: 1.5rem 0; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 0.5rem; }
    footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: 3rem; display: flex; justify-content: space-between; }
    .back-link { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: var(--text-muted); text-decoration: none; letter-spacing: 0.5px; transition: color 0.15s; }
    .back-link svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
    .back-link:hover { color: var(--accent); }
    .footer-id { font-family: var(--mono); font-size: 10px; color: var(--text-muted); letter-spacing: 1px; }
  </style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="topbar">
      <a href="/" class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2zm-1 13l-3-3 1.4-1.4 1.6 1.6 4.6-4.6 1.4 1.4L11 15z"/></svg>
        </div>
        <div>
          <div class="brand-name">Sortify</div>
          <div class="brand-version">v1.0 · OOP Waste System</div>
        </div>
      </a>
    </div>
  </header>

  <div th:if="${success}" class="alert alert-success">
    <span th:text="${success}">Berhasil!</span>
  </div>
  <div th:if="${error}" class="alert alert-error">
    <svg viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    <span th:text="${error}">Error</span>
  </div>

  <div class="page-head">
    <div class="page-label">Keamanan Akun</div>
    <h1 class="page-title">Ubah <strong>Password</strong></h1>
  </div>

  <div class="form-card">
    <div class="form-card-header">
      <div class="form-card-header-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <span class="form-card-header-title">Ganti Password Akun</span>
    </div>
    <div class="form-body">
      <form th:action="@{/warga/ubah-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group">
          <label class="form-label">Password Lama</label>
          <input type="password" name="passwordLama" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password Baru</label>
          <input type="password" name="passwordBaru" class="form-input" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label">Konfirmasi Password Baru</label>
          <input type="password" name="konfirmasiPassword" class="form-input" required minlength="6">
        </div>

        <div class="form-divider"></div>

        <div class="form-actions">
          <a href="/warga/dashboard" class="btn btn-ghost">
            <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Batal
          </a>
          <button type="submit" class="btn btn-primary">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            Simpan Password
          </button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <a href="/warga/dashboard" class="back-link">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Kembali ke Dashboard
    </a>
    <span class="footer-id">UBAH · PASSWORD</span>
  </footer>
</div>
</body>
</html>
