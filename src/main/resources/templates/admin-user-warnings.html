<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sortify — Detail Warnings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0d0f0c;--surface:#141710;--surface-raised:#1a1e16;--surface-hover:#1d2219;--border:rgba(134,187,76,0.12);--border-hover:rgba(134,187,76,0.28);--accent:#86bb4c;--accent-dim:rgba(134,187,76,0.08);--amber:#c8891a;--amber-dim:rgba(200,137,26,0.08);--danger:#b85454;--danger-dim:rgba(184,84,84,0.1);--text-primary:#e8ede2;--text-secondary:#8a9480;--text-muted:#4e5749;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif}
    body{background:var(--bg);color:var(--text-primary);font-family:var(--sans);font-size:15px;min-height:100vh}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(134,187,76,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(134,187,76,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
    .wrapper{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:0 2rem 4rem}
    header{padding:2rem 0 0}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none}
    .brand-icon{width:36px;height:36px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center}
    .brand-icon svg{width:20px;height:20px;fill:var(--bg)}
    .brand-name{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--accent)}
    .brand-version{font-family:var(--mono);font-size:10px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase}
    .btn-back{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--text-muted);text-decoration:none;border:1px solid var(--border);border-radius:7px;padding:.45rem .9rem}
    .btn-back:hover{border-color:var(--border-hover);color:var(--text-primary)}
    .page-head{padding:3rem 0 2rem}
    .page-label{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px;margin-bottom:.6rem}
    .page-label::before{content:'';display:block;width:24px;height:1px;background:var(--accent)}
    .page-title{font-size:clamp(1.5rem,3.5vw,2rem);font-weight:300;letter-spacing:-1px}
    .page-title strong{font-weight:500;color:var(--accent)}

    .user-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:1.25rem;animation:fadeUp .45s ease both;animation-delay:.12s}
    .user-avatar{width:52px;height:52px;border-radius:12px;background:var(--accent-dim);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .user-avatar svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.5}
    .user-info{flex:1;min-width:0}
    .user-nama{font-size:16px;font-weight:500;margin-bottom:2px}
    .user-detail{font-family:var(--mono);font-size:11px;color:var(--text-muted)}
    .user-stats{display:flex;gap:20px;margin-top:6px}
    .user-stat{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--text-secondary);letter-spacing:.5px;text-transform:uppercase}
    .user-stat .num{font-size:13px;font-weight:700}
    .status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-family:var(--mono);font-size:10px;letter-spacing:.5px;border:1px solid;white-space:nowrap}
    .status-badge .dot{width:5px;height:5px;border-radius:50%}
    .badge-active{background:var(--accent-dim);border-color:rgba(134,187,76,0.25);color:var(--accent)}
    .badge-active .dot{background:var(--accent)}
    .badge-suspended{background:var(--amber-dim);border-color:rgba(200,137,26,0.25);color:var(--amber)}
    .badge-suspended .dot{background:var(--amber)}
    .badge-banned{background:var(--danger-dim);border-color:rgba(184,84,84,0.25);color:var(--danger)}
    .badge-banned .dot{background:var(--danger)}
    .badge-warning{background:var(--amber-dim);border-color:rgba(200,137,26,0.25);color:var(--amber)}
    .badge-suspend{background:var(--danger-dim);border-color:rgba(184,84,84,0.25);color:var(--danger)}
    .badge-ban{background:rgba(184,84,84,0.15);border-color:rgba(184,84,84,0.3);color:#dd7777}

    .warning-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;margin-bottom:.75rem;transition:border-color .15s}
    .warning-item:hover{border-color:var(--border-hover)}
    .warning-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .warning-type{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase}
    .warning-date{font-family:var(--mono);font-size:10px;color:var(--text-muted)}
    .warning-reason{font-size:14px;color:var(--text-primary);line-height:1.5;margin-bottom:6px}
    .warning-issued{font-size:11px;color:var(--text-muted)}
    .warning-issued span{color:var(--text-secondary)}

    .empty-state{text-align:center;padding:2rem;color:var(--text-muted);font-size:13px}
    footer{border-top:1px solid var(--border);padding:1.5rem 0;margin-top:3rem;display:flex;align-items:center;justify-content:space-between}
    .footer-id{font-family:var(--mono);font-size:10px;color:var(--text-muted);letter-spacing:1px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .animate{animation:fadeUp .45s ease both}
    .delay-1{animation-delay:.05s}.delay-2{animation-delay:.12s}.delay-3{animation-delay:.2s}.delay-4{animation-delay:.28s}
  </style>
</head>
<body>
<div class="wrapper">
  <header class="animate">
    <div class="topbar">
      <a href="/admin/dashboard" class="brand">
        <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2z"/></svg></div>
        <div><div class="brand-name">Sortify</div><div class="brand-version">v1.0 · Admin Panel</div></div>
      </a>
      <a href="/admin/warnings" class="btn-back">
        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Kembali
      </a>
    </div>
  </header>

  <div class="page-head animate delay-1">
    <div class="page-label">Admin · Detail Warnings</div>
    <h1 class="page-title">Riwayat <strong>Sanksi</strong></h1>
  </div>

  <div class="user-card animate delay-2">
    <div class="user-avatar">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div class="user-info">
      <div class="user-nama" th:text="${targetUser.fullName}">Nama User</div>
      <div class="user-detail">
        <span th:text="'@' + ${targetUser.username}">username</span>
        <span th:if="${targetUser.role.name() == 'WARGA' and targetUser.warga != null}" th:text="' — ' + ${targetUser.warga.alamat}" style="color:var(--text-muted)">Alamat</span>
      </div>
      <div class="user-stats">
        <span class="user-stat">Status <span class="num" th:text="${targetUser.accountStatus.name()}">ACTIVE</span></span>
        <span class="user-stat">Peringatan <span class="num" th:text="${targetUser.warningCount}">0</span></span>
        <span class="user-stat">Total Poin <span class="num" th:text="${targetUser.totalPoints}">0</span></span>
      </div>
    </div>
  </div>

  <div class="animate delay-3">
    <div th:each="w : ${warningList}" class="warning-item">
      <div class="warning-head">
        <span class="warning-type status-badge"
              th:classappend="${w.type.name() == 'WARNING'} ? 'badge-warning' : (${w.type.name() == 'SUSPEND'} ? 'badge-suspend' : 'badge-ban')">
          <span class="dot"></span>
          <span th:text="${w.type.name() == 'WARNING'} ? 'PERINGATAN' : (${w.type.name() == 'SUSPEND'} ? 'SUSPEND' : 'BAN')">WARNING</span>
        </span>
        <span class="warning-date" th:text="${#temporals.format(w.createdAt, 'dd MMM yyyy HH:mm')}">—</span>
      </div>
      <div class="warning-reason" th:text="${w.reason}">Alasan</div>
      <div class="warning-issued">Diberikan oleh <span th:text="${w.issuedBy}">admin</span></div>
    </div>
    <div th:if="${#lists.isEmpty(warningList)}" class="empty-state">Tidak ada riwayat sanksi untuk akun ini.</div>
  </div>

  <footer class="animate delay-4">
    <span class="footer-id">ADMIN · DETAIL WARNINGS</span>
    <span class="footer-id">SORTIFY v1.0</span>
  </footer>
</div>
</body>
</html>
