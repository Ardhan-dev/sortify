<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sortify — Profil Saya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f0c; --surface: #141710; --surface-raised: #1a1e16;
      --border: rgba(134, 187, 76, 0.12); --border-hover: rgba(134, 187, 76, 0.28);
      --accent: #86bb4c; --accent-dim: rgba(134, 187, 76, 0.08);
      --text-primary: #e8ede2; --text-secondary: #8a9480; --text-muted: #4e5749;
      --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
      --red: #e05454; --red-dim: rgba(224, 84, 84, 0.08);
      --yellow: #d4a843; --yellow-dim: rgba(212, 168, 67, 0.08);
    }
    body { background: var(--bg); color: var(--text-primary); font-family: var(--sans); font-size: 15px; min-height: 100vh; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(134,187,76,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(134,187,76,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
    .wrapper { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; padding: 0 2rem 4rem; }

    header { padding: 2rem 0 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .brand-icon svg { width: 20px; height: 20px; fill: var(--bg); }
    .brand-name { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--accent); }
    .brand-version { font-family: var(--mono); font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }

    .logout-btn { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: var(--text-muted); text-decoration: none; border: 1px solid var(--border); border-radius: 7px; padding: 0.45rem 0.9rem; transition: all 0.15s; }
    .logout-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
    .logout-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }

    .page-head { padding: 3rem 0 2rem; }
    .page-label { font-family: var(--mono); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; margin-bottom: 0.6rem; }
    .page-label::before { content: ''; display: block; width: 24px; height: 1px; background: var(--accent); }
    .page-title { font-size: 2rem; font-weight: 300; letter-spacing: -1px; }
    .page-title strong { font-weight: 500; color: var(--accent); }

    /* Profile Card */
    .profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; animation: fadeUp 0.45s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .profile-card-header { padding: 1.5rem 1.75rem; background: var(--surface-raised); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
    .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-dim); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .avatar svg { width: 24px; height: 24px; stroke: var(--accent); fill: none; stroke-width: 2; }
    .profile-name { font-size: 1.1rem; font-weight: 500; color: var(--text-primary); }
    .profile-badge { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 2px 8px; background: var(--accent-dim); border: 1px solid rgba(134,187,76,0.2); border-radius: 20px; font-family: var(--mono); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }

    .profile-body { padding: 1.75rem; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .info-item { display: flex; flex-direction: column; gap: 4px; }
    .info-label { font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
    .info-value { font-size: 14px; color: var(--text-primary); }
    .info-value.mono { font-family: var(--mono); font-size: 13px; }

    /* Section header shared */
    .section-head { display: flex; align-items: center; justify-content: space-between; margin: 2.5rem 0 1rem; }
    .section-label { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .section-label::before { content: ''; display: block; width: 16px; height: 1px; background: var(--accent); }
    .section-count { font-family: var(--mono); font-size: 10px; color: var(--text-muted); background: var(--surface-raised); border: 1px solid var(--border); border-radius: 20px; padding: 2px 10px; }

    /* Transaction list */
    .tx-list { display: flex; flex-direction: column; gap: 0.6rem; }

    .tx-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
      animation: fadeUp 0.4s ease both;
      transition: border-color 0.15s;
      cursor: default;
    }
    .tx-item:hover { border-color: var(--border-hover); }

    /* stagger */
    .tx-item:nth-child(1) { animation-delay: 0.05s; }
    .tx-item:nth-child(2) { animation-delay: 0.10s; }
    .tx-item:nth-child(3) { animation-delay: 0.15s; }
    .tx-item:nth-child(4) { animation-delay: 0.20s; }
    .tx-item:nth-child(5) { animation-delay: 0.25s; }

    .tx-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tx-icon svg { width: 16px; height: 16px; fill: none; stroke-width: 2; }
    .tx-icon.organik  { background: var(--accent-dim);  }  .tx-icon.organik  svg { stroke: var(--accent); }
    .tx-icon.anorganik{ background: var(--yellow-dim);  }  .tx-icon.anorganik svg { stroke: var(--yellow); }
    .tx-icon.b3       { background: var(--red-dim);     }  .tx-icon.b3       svg { stroke: var(--red); }

    .tx-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .tx-jenis { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-jenis.organik   { color: var(--accent); }
    .tx-jenis.anorganik { color: var(--yellow); }
    .tx-jenis.b3        { color: var(--red); }

    .tx-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tx-id { font-family: var(--mono); font-size: 9px; color: var(--text-muted); }
    .tx-dot { width: 2px; height: 2px; border-radius: 50%; background: var(--text-muted); }
    .tx-date { font-family: var(--mono); font-size: 9px; color: var(--text-muted); }

    .tx-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .tx-berat { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--text-primary); }
    .tx-status { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.5px; padding: 2px 7px; border-radius: 20px; }
    .tx-status.selesai  { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(134,187,76,0.18); }
    .tx-status.proses   { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(212,168,67,0.18); }
    .tx-status.ditolak  { background: var(--red-dim);    color: var(--red);    border: 1px solid rgba(224,84,84,0.18); }
    .tx-status::before  { content: ''; display: block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    /* Empty state */
    .tx-empty { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 2.5rem 1.5rem; text-align: center; }
    .tx-empty-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
    .tx-empty-icon svg { width: 20px; height: 20px; stroke: var(--text-muted); fill: none; stroke-width: 2; }
    .tx-empty-text { font-family: var(--mono); font-size: 11px; color: var(--text-muted); letter-spacing: 1px; }

    footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: 3rem; display: flex; justify-content: space-between; }
    .footer-id { font-family: var(--mono); font-size: 10px; color: var(--text-muted); letter-spacing: 1px; }

    @media (max-width: 480px) {
      .info-grid { grid-template-columns: 1fr; }
      .tx-item { grid-template-columns: auto 1fr; }
      .tx-right { display: none; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <div class="topbar">
      <a href="/" class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2zm-1 13l-3-3 1.4-1.4 1.6 1.6 4.6-4.6 1.4 1.4L11 15z"/></svg>
        </div>
        <div>
          <div class="brand-name">Sortify</div>
          <div class="brand-version">v1.0 · OOP Waste System</div>
        </div>
      </a>
      <form action="/logout" method="post" style="margin:0;">
        <button type="submit" class="logout-btn" style="border:1px solid var(--border); background:transparent; cursor:pointer; display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px; color:var(--text-muted); text-decoration:none; border-radius:7px; padding:0.45rem 0.9rem; transition:all 0.15s;">
          <svg viewBox="0 0 24 24" width="13" height="13"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Keluar
        </button>
      </form>
    </div>
  </header>

  <div class="page-head">
    <div class="page-label">Modul 03 · Profil</div>
    <h1 class="page-title">Profil <strong>Saya</strong></h1>
  </div>

  <!-- Profile Card -->
  <div class="profile-card">
    <div class="profile-card-header">
      <div class="avatar">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div>
        <div class="profile-name" th:text="${warga.fullName}">Nama Warga</div>
        <div class="profile-badge">
          <svg viewBox="0 0 24 24" width="9" height="9"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Warga
        </div>
      </div>
    </div>

    <div class="profile-body">
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">ID Warga</div>
          <div class="info-value mono" th:text="'#' + ${warga.id}">—</div>
        </div>
        <div class="info-item">
          <div class="info-label">Username</div>
          <div class="info-value mono" th:text="${warga.username}">—</div>
        </div>
        <div class="info-item">
          <div class="info-label">Nama Lengkap</div>
          <div class="info-value" th:text="${warga.fullName}">—</div>
        </div>
        <div class="info-item">
          <div class="info-label">Total Poin</div>
          <div class="info-value mono" th:text="${warga.totalPoints} + ' poin'">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div style="display:flex; gap:10px; margin: 1.5rem 0;">
    <a href="/warga/laporan/tambah" style="display:inline-flex; align-items:center; gap:7px; padding:0.55rem 1.1rem; font-family:var(--mono); font-size:11px; letter-spacing:0.5px; text-transform:uppercase; text-decoration:none; border-radius:7px; background:var(--accent); color:var(--bg); border:1px solid var(--accent); transition:background 0.18s;">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Lapor Sampah
    </a>
    <a href="/warga/reward" style="display:inline-flex; align-items:center; gap:7px; padding:0.55rem 1.1rem; font-family:var(--mono); font-size:11px; letter-spacing:0.5px; text-transform:uppercase; text-decoration:none; border-radius:7px; background:transparent; color:var(--text-secondary); border:1px solid var(--border); transition:all 0.18s;">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Reward
    </a>
    <a href="/kamus-sampah" style="display:inline-flex; align-items:center; gap:7px; padding:0.55rem 1.1rem; font-family:var(--mono); font-size:11px; letter-spacing:0.5px; text-transform:uppercase; text-decoration:none; border-radius:7px; background:transparent; color:var(--text-secondary); border:1px solid var(--border); transition:all 0.18s;">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      Kamus Sampah
    </a>
  </div>

  <!-- Laporan History -->
  <div class="section-head">
    <div class="section-label">History Laporan</div>
    <span class="section-count" th:text="${laporanList != null ? #lists.size(laporanList) + ' laporan' : '0 laporan'}">0 laporan</span>
  </div>

  <div class="tx-list" th:if="${laporanList != null and !laporanList.isEmpty()}">
    <div class="tx-item" th:each="l : ${laporanList}">

      <div class="tx-icon"
           th:classappend="${l.jenisSampah.name() == 'ORGANIK'} ? 'organik' : (${l.jenisSampah.name() == 'ANORGANIK'} ? 'anorganik' : 'b3')">
        <svg th:if="${l.jenisSampah.name() == 'ORGANIK'}" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
          <path d="M17 8C8 10 5.9 16.17 3.82 19.34A1 1 0 0 0 4.8 21 12.07 12.07 0 0 0 21 9c0-4-2-6-4-6C16 3 17 5 17 8z"/>
          <path d="M4 22a14 14 0 0 0 4-2 15 15 0 0 0 4-5"/>
        </svg>
        <svg th:if="${l.jenisSampah.name() == 'ANORGANIK'}" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-4.5"/>
        </svg>
        <svg th:if="${l.jenisSampah.name() == 'B3'}" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>

      <div class="tx-meta">
        <div class="tx-jenis"
             th:classappend="${l.jenisSampah.name() == 'ORGANIK'} ? 'organik' : (${l.jenisSampah.name() == 'ANORGANIK'} ? 'anorganik' : 'b3')"
             th:text="${l.jenisSampah.name()}">JENIS</div>
        <div class="tx-sub">
          <span class="tx-id" th:text="'#LP-' + ${l.id}">—</span>
          <span class="tx-dot"></span>
          <span class="tx-date" th:text="${#temporals.format(l.createdAt, 'dd MMM yyyy')}">—</span>
        </div>
      </div>

      <div class="tx-right">
        <div class="tx-berat" th:text="${l.beratFinal != null ? l.beratFinal + ' kg' : l.berat + ' kg'}">— kg</div>
        <div class="tx-status"
             th:classappend="${l.status.name() == 'SELESAI'} ? 'selesai' : (${l.status.name() == 'DIPROSES'} ? 'proses' : (${l.status.name() == 'DITOLAK'} ? 'ditolak' : 'proses'))"
             th:text="${l.status.name()}">Status</div>
        <a th:if="${l.status.name() == 'MENUNGGU_PEMBAYARAN'}" th:href="@{/warga/laporan/bayar/{id}(id=${l.id})}" style="font-family:var(--mono); font-size:9px; color:var(--accent); text-decoration:none; margin-top:4px;">
          Bayar →
        </a>
      </div>

    </div>
  </div>

  <div class="tx-empty" th:if="${laporanList == null or laporanList.isEmpty()}">
    <div class="tx-empty-icon">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    </div>
    <div class="tx-empty-text">Belum ada laporan sampah</div>
  </div>

  <footer>
    <span class="footer-id">MODULE · 03 / PROFIL · WARGA</span>
    <span class="footer-id">SORTIFY v1.0</span>
  </footer>

</div>
</body>
</html>
