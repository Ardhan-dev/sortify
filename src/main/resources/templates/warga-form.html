<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${warga.idWarga != null} ? 'Sortify — Edit Warga' : 'Sortify — Tambah Warga'">Sortify — Form Warga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f0c;
      --surface: #141710;
      --surface-raised: #1a1e16;
      --surface-hover: #1e2318;
      --border: rgba(134, 187, 76, 0.12);
      --border-hover: rgba(134, 187, 76, 0.28);
      --border-focus: rgba(134, 187, 76, 0.55);
      --accent: #86bb4c;
      --accent-dim: rgba(134, 187, 76, 0.08);
      --text-primary: #e8ede2;
      --text-secondary: #8a9480;
      --text-muted: #4e5749;
      --danger: #b85454;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(134,187,76,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(134,187,76,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 400px;
      background: radial-gradient(ellipse, rgba(134,187,76,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    /* ── HEADER ── */
    header { padding: 2rem 0 0; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }

    .brand-icon svg { width: 20px; height: 20px; fill: var(--bg); }

    .brand-name {
      font-family: var(--mono);
      font-size: 18px; font-weight: 700;
      color: var(--accent); letter-spacing: -0.5px;
    }

    .brand-version {
      font-family: var(--mono);
      font-size: 10px; color: var(--text-muted);
      letter-spacing: 1px; text-transform: uppercase; margin-top: 1px;
    }

    .sys-status {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 11px;
      color: var(--text-muted); letter-spacing: 0.5px;
    }

    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── PAGE TITLE ── */
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 3.5rem 0 2rem;
    }

    .page-label {
      font-family: var(--mono);
      font-size: 11px; letter-spacing: 2.5px;
      text-transform: uppercase; color: var(--accent);
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 0.8rem;
    }

    .page-label::before {
      content: '';
      display: block; width: 24px; height: 1px;
      background: var(--accent);
    }

    .page-title {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 300; letter-spacing: -1px;
      color: var(--text-primary); line-height: 1.2;
    }

    .page-title strong { font-weight: 500; color: var(--accent); }

    /* ── FORM CARD ── */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .form-card-header {
      padding: 1.25rem 1.75rem;
      background: var(--surface-raised);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }

    .form-card-header-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: var(--accent-dim);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .form-card-header-icon svg {
      width: 14px; height: 14px;
      stroke: var(--accent); fill: none; stroke-width: 2;
    }

    .form-card-header-title {
      font-family: var(--mono);
      font-size: 11px; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text-muted);
    }

    .form-body {
      padding: 2rem 1.75rem;
    }

    /* ── FIELD GROUPS ── */
    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem 1.5rem;
    }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group.full { grid-column: 1 / -1; }

    .field-label {
      font-family: var(--mono);
      font-size: 10px; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }

    .field-label .required {
      color: var(--accent); font-size: 12px; line-height: 1;
    }

    .field-hint {
      font-size: 11px; color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── INPUTS ── */
    .field-input,
    .field-textarea {
      width: 100%;
      padding: 0.7rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--sans);
      font-size: 14px;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }

    .field-input::placeholder,
    .field-textarea::placeholder {
      color: var(--text-muted);
    }

    .field-input:hover,
    .field-textarea:hover {
      border-color: var(--border-hover);
    }

    .field-input:focus,
    .field-textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(134, 187, 76, 0.08);
      background: var(--surface);
    }

    /* ID field (readonly) */
    .field-input[readonly] {
      color: var(--text-muted);
      cursor: not-allowed;
      font-family: var(--mono);
      font-size: 13px;
    }

    .field-input[readonly]:focus {
      border-color: var(--border);
      box-shadow: none;
      background: var(--bg);
    }

    .field-textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.6;
    }

    /* Input with prefix icon */
    .field-input-wrap {
      position: relative;
    }

    .field-input-wrap .field-prefix {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      font-family: var(--mono); font-size: 12px;
      color: var(--text-muted); pointer-events: none;
      user-select: none;
    }

    .field-input-wrap .field-input {
      padding-left: 2.8rem;
    }

    .field-input-wrap .field-icon {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .field-input-wrap .field-icon svg {
      width: 14px; height: 14px;
      stroke: var(--text-muted); fill: none; stroke-width: 2;
    }

    /* ── DIVIDER ── */
    .form-divider {
      height: 1px;
      background: var(--border);
      margin: 1.75rem 0;
    }

    /* ── FORM ACTIONS ── */
    .form-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding-top: 1rem;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 0.6rem 1.25rem;
      font-family: var(--mono); font-size: 11px;
      letter-spacing: 0.5px; text-transform: uppercase;
      text-decoration: none; border-radius: 7px;
      border: 1px solid; cursor: pointer;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
      font-size: 12px;
    }

    .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

    .btn-primary {
      background: var(--accent); color: var(--bg);
      border-color: var(--accent);
    }
    .btn-primary:hover { background: #97cc5a; border-color: #97cc5a; }

    .btn-ghost {
      background: transparent; color: var(--text-secondary);
      border-color: var(--border);
    }
    .btn-ghost:hover { border-color: var(--border-hover); color: var(--text-primary); background: var(--accent-dim); }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 0; margin-top: 3rem;
      display: flex; align-items: center; justify-content: space-between;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: var(--mono); font-size: 11px;
      color: var(--text-muted); text-decoration: none;
      letter-spacing: 0.5px;
      transition: color 0.15s;
    }

    .back-link svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
    .back-link:hover { color: var(--accent); }

    .footer-id {
      font-family: var(--mono); font-size: 10px;
      color: var(--text-muted); letter-spacing: 1px;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .animate { animation: fadeUp 0.45s ease both; }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.12s; }
    .delay-3 { animation-delay: 0.2s; }
    .delay-4 { animation-delay: 0.28s; }

    @media (max-width: 640px) {
      .field-grid { grid-template-columns: 1fr; }
      .page-head { flex-direction: column; align-items: flex-start; }
      .form-body { padding: 1.5rem 1.25rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- HEADER -->
  <header class="animate">
    <div class="topbar">
      <a href="/" class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2zm-1 13l-3-3 1.4-1.4 1.6 1.6 4.6-4.6 1.4 1.4L11 15z"/></svg>
        </div>
        <div>
          <div class="brand-name">Sortify</div>
          <div class="brand-version">v1.0 · OOP Waste System</div>
        </div>
      </a>
      <div class="sys-status">
        <div class="status-dot"></div>
        SISTEM AKTIF
      </div>
    </div>
  </header>

  <!-- PAGE TITLE -->
  <div class="page-head animate delay-1">
    <div>
      <div class="page-label" th:text="${warga.idWarga != null} ? 'Modul 01 · Edit' : 'Modul 01 · Tambah'">Modul 01</div>
      <h1 class="page-title" th:if="${warga.idWarga != null}">Edit <strong>Warga</strong></h1>
      <h1 class="page-title" th:if="${warga.idWarga == null}">Tambah <strong>Warga</strong></h1>
    </div>
  </div>

  <!-- FORM CARD -->
  <div class="form-card animate delay-2">

    <div class="form-card-header">
      <div class="form-card-header-icon">
        <svg viewBox="0 0 24 24" th:if="${warga.idWarga != null}">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        <svg viewBox="0 0 24 24" th:if="${warga.idWarga == null}">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
      <span class="form-card-header-title"
            th:text="${warga.idWarga != null} ? 'Ubah data warga yang sudah terdaftar' : 'Isi data warga baru'">
        Form Warga
      </span>
    </div>

    <div class="form-body">
      <!-- ACTION: tambah atau edit tergantung idWarga -->
      <form th:action="${warga.idWarga != null} ? @{/admin/warga/edit/{id}(id=${warga.idWarga})} : @{/admin/warga/tambah}"
            th:object="${warga}"
            method="post">

        <div class="field-grid">

          <!-- ID (readonly, hanya tampil saat edit) -->
          <div class="field-group" th:if="${warga.idWarga != null}">
            <label class="field-label">ID Warga</label>
            <input type="text"
                   class="field-input"
                   th:value="${warga.idWarga}"
                   readonly>
            <span class="field-hint">ID ditetapkan otomatis oleh sistem.</span>
          </div>

          <!-- Spacer saat edit agar nama tetap di kolom kanan -->
          <div th:if="${warga.idWarga != null}"></div>

          <!-- Username -->
          <div class="field-group">
            <label class="field-label" for="username">
              Username <span class="required">*</span>
            </label>
            <div class="field-input-wrap">
              <div class="field-icon">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <input type="text"
                     id="username"
                     class="field-input"
                     th:field="*{username}"
                     placeholder="Username untuk login"
                     required
                     style="padding-right: 2.4rem;">
            </div>
          </div>

          <!-- Password (only for new records) -->
          <div class="field-group" th:if="${isNew}">
            <label class="field-label" for="password">
              Password <span class="required">*</span>
            </label>
            <div class="field-input-wrap">
              <div class="field-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </div>
              <input type="password"
                     id="password"
                     class="field-input"
                     name="password"
                     placeholder="Min. 6 karakter"
                     required
                     minlength="6"
                     style="padding-right: 2.4rem;">
            </div>
          </div>

          <!-- Nama -->
          <div class="field-group" th:classappend="${warga.idWarga == null} ? 'full' : ''">
            <label class="field-label" for="nama">
              Nama Lengkap <span class="required">*</span>
            </label>
            <div class="field-input-wrap">
              <div class="field-icon">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <input type="text"
                     id="nama"
                     class="field-input"
                     th:field="*{nama}"
                     placeholder="Contoh: Budi Santoso"
                     required
                     style="padding-right: 2.4rem;">
            </div>
          </div>

          <!-- Alamat (full width) -->
          <div class="field-group full">
            <label class="field-label" for="alamat">
              Alamat <span class="required">*</span>
            </label>
            <textarea id="alamat"
                      class="field-textarea"
                      th:field="*{alamat}"
                      placeholder="Contoh: Jl. Merdeka No. 10, RT 03/RW 04, Bandung"
                      required></textarea>
          </div>

          <!-- No HP -->
          <div class="field-group">
            <label class="field-label" for="noHp">
              No. HP <span class="required">*</span>
            </label>
            <div class="field-input-wrap">
              <span class="field-prefix">+62</span>
              <input type="tel"
                     id="noHp"
                     class="field-input"
                     th:field="*{noHp}"
                     placeholder="08xxxxxxxxxx"
                     required>
            </div>
            <span class="field-hint">Format: 08xx atau +62xx</span>
          </div>

        </div><!-- /field-grid -->

        <div class="form-divider"></div>

        <!-- ACTIONS -->
        <div class="form-actions">
          <a href="/admin/warga" class="btn btn-ghost">
            <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Batal
          </a>
          <button type="submit" class="btn btn-primary">
            <svg viewBox="0 0 24 24" th:if="${warga.idWarga != null}">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            <svg viewBox="0 0 24 24" th:if="${warga.idWarga == null}">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            <span th:text="${warga.idWarga != null} ? 'Simpan Perubahan' : 'Simpan Warga'">Simpan</span>
          </button>
        </div>

      </form>
    </div><!-- /form-body -->
  </div><!-- /form-card -->

  <!-- FOOTER -->
  <footer class="animate delay-4">
    <a href="/admin/warga" class="back-link">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Kembali ke Data Warga
    </a>
    <div class="footer-id">MODULE · 01 / WARGA · FORM</div>
  </footer>

</div>
</body>
</html>
