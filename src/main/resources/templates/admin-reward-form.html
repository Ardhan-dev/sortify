<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sortify — Form Reward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f0c; --surface: #141710; --surface-raised: #1a1e16;
      --border: rgba(134, 187, 76, 0.12); --border-hover: rgba(134, 187, 76, 0.28); --border-focus: rgba(134, 187, 76, 0.55);
      --accent: #86bb4c; --accent-dim: rgba(134, 187, 76, 0.08);
      --amber: #c8891a; --amber-dim: rgba(200,137,26,0.08);
      --text-primary: #e8ede2; --text-secondary: #8a9480; --text-muted: #4e5749;
      --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
    }
    body { background: var(--bg); color: var(--text-primary); font-family: var(--sans); font-size: 15px; min-height: 100vh; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(134,187,76,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(134,187,76,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    .wrapper { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 0 2rem 4rem; }
    header { padding: 2rem 0 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .brand-icon svg { width: 20px; height: 20px; fill: var(--bg); }
    .brand-name { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--accent); }
    .brand-version { font-family: var(--mono); font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
    .btn-back { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: var(--text-muted); text-decoration: none; border: 1px solid var(--border); border-radius: 7px; padding: 0.45rem 0.9rem; }
    .btn-back:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .btn-back svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
    .page-head { padding: 3rem 0 2rem; }
    .page-label { font-family: var(--mono); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--amber); display: flex; align-items: center; gap: 8px; margin-bottom: 0.6rem; }
    .page-label::before { content: ''; display: block; width: 24px; height: 1px; background: var(--amber); }
    .page-title { font-size: 2rem; font-weight: 300; letter-spacing: -1px; }
    .page-title strong { font-weight: 500; color: var(--amber); }
    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .form-card-header { padding: 1.25rem 1.75rem; background: var(--surface-raised); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .form-card-header-icon { width: 28px; height: 28px; border-radius: 6px; background: var(--amber-dim); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
    .form-card-header-icon svg { width: 14px; height: 14px; stroke: var(--amber); fill: none; stroke-width: 2; }
    .form-card-header-title { font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
    .form-body { padding: 2rem 1.75rem; }
    .field-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1.25rem; }
    .field-label { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
    .field-label .required { color: var(--amber); }
    .field-input { width: 100%; padding: 0.7rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-family: var(--sans); font-size: 14px; outline: none; }
    .field-input:focus { border-color: var(--border-focus); background: var(--surface); }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 1.25rem 1.75rem; background: var(--surface-raised); border-top: 1px solid var(--border); }
    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 0.6rem 1.25rem; font-family: var(--mono); font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; text-decoration: none; border-radius: 7px; border: 1px solid; cursor: pointer; }
    .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    .btn-primary { background: var(--amber); color: var(--bg); border-color: var(--amber); }
    .btn-primary:hover { background: #da9b2a; }
    .btn-ghost { background: transparent; color: var(--text-secondary); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--border-hover); color: var(--text-primary); background: var(--amber-dim); }
    footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: 3rem; display: flex; justify-content: space-between; }
    .footer-id { font-family: var(--mono); font-size: 10px; color: var(--text-muted); letter-spacing: 1px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) { .form-body { padding: 1.5rem 1.25rem; } }
  </style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="topbar">
      <a href="/admin/dashboard" class="brand">
        <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2z"/></svg></div>
        <div><div class="brand-name">Sortify</div><div class="brand-version">v1.0 · Admin</div></div>
      </a>
      <a href="/admin/reward" class="btn-back">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Kembali
      </a>
    </div>
  </header>
  <div class="page-head">
    <div class="page-label">Admin · Reward</div>
    <h1 class="page-title" th:text="${isEdit} ? 'Edit <strong>Reward</strong>' : 'Tambah <strong>Reward</strong>'" th:utext="${isEdit} ? 'Edit <strong>Reward</strong>' : 'Tambah <strong>Reward</strong>'">Tambah Reward</h1>
  </div>
  <div class="form-card">
    <div class="form-card-header">
      <div class="form-card-header-icon"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
      <span class="form-card-header-title" th:text="${isEdit} ? 'Edit data reward' : 'Isi data reward baru'">Form</span>
    </div>
    <form th:action="${isEdit} ? @{/admin/reward/edit/{id}(id=${reward.id})} : @{/admin/reward/tambah}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="form-body">
        <div class="field-group">
          <label class="field-label" for="namaBarang">Nama Barang <span class="required">*</span></label>
          <input type="text" id="namaBarang" name="namaBarang" class="field-input"
                 th:value="${reward?.namaBarang}" placeholder="Contoh: Beras 5kg" required>
        </div>
        <div class="field-group">
          <label class="field-label" for="pointNeeded">Poin Dibutuhkan <span class="required">*</span></label>
          <input type="number" id="pointNeeded" name="pointNeeded" class="field-input"
                 th:value="${reward?.pointNeeded}" step="1" min="1" placeholder="1000" required>
        </div>
        <div class="field-group">
          <label class="field-label" for="stock">Stok <span class="required">*</span></label>
          <input type="number" id="stock" name="stock" class="field-input"
                 th:value="${reward?.stock}" step="1" min="0" placeholder="50" required>
        </div>
      </div>
      <div class="form-actions">
        <a href="/admin/reward" class="btn btn-ghost">
          <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Batal
        </a>
        <button type="submit" class="btn btn-primary">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span th:text="${isEdit} ? 'Simpan Perubahan' : 'Simpan'">Simpan</span>
        </button>
      </div>
    </form>
  </div>
  <footer>
    <span class="footer-id">ADMIN · REWARD</span>
    <span class="footer-id">SORTIFY v1.0</span>
  </footer>
</div>
</body>
</html>
